  - 실제 접속 기준으로 핵심 UI 흐름이 동작하고 re-entry와 negative-check까지 검증된다.
  - manager가 `stage_manager_reverified`를 남기고 completion guard를 통과한다.
  step:
  - trigger -> process -> result
  tasks:
  - implement success
  constraints:
  - 'success -> success : requirement 기반 draft item 생성'
  check:
  - verify success
