[package]
name = "rc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.14"
